<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kronieka — Aktivasi Akun</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --accent:#8f1d2c;
  --accent-dark:#6f1421;
  --bg:#f7f7f8;
  --line:#e5e7eb;
  --text:#17191c;
  --muted:#72757b;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.box{
  width:min(430px,100%);
  background:#fff;
  border:1px solid var(--line);
  border-top:4px solid var(--accent);
  border-radius:16px;
  padding:30px;
  box-shadow:0 18px 55px rgba(20,24,30,.09);
}

.logo{
  width:170px;
  height:auto;
  display:block;
  margin-bottom:8px;
}

.subtitle{
  color:var(--muted);
  font-size:13px;
  margin-bottom:25px;
}

h1{
  font-size:22px;
  margin:0 0 8px;
}

.desc{
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
  margin-bottom:22px;
}

.form{
  display:grid;
  gap:14px;
}

label{
  font-size:12px;
  font-weight:700;
}

input{
  width:100%;
  margin-top:6px;
  border:1px solid #dddfe4;
  border-radius:9px;
  padding:11px;
  outline:none;
  font:inherit;
}

input:focus{
  border-color:#b66a75;
  box-shadow:0 0 0 3px rgba(143,29,44,.09);
}

input[readonly]{
  background:#f5f5f6;
  color:#666;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 14px;
  background:var(--accent);
  color:#fff;
  font-weight:700;
  cursor:pointer;
  margin-top:5px;
}

button:hover{
  background:var(--accent-dark);
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.message{
  margin-top:15px;
  font-size:12px;
  line-height:1.5;
}

.success{color:#18794e}
.error{color:#b42318}

.loading{
  text-align:center;
  color:var(--muted);
  padding:20px 0;
}
</style>
</head>

<body>

<div class="box">

  <!-- Ganti logo jika nanti ingin memakai file logo GitHub -->
  <div style="font-size:25px;font-weight:850;letter-spacing:-.04em;margin-bottom:5px">
    kronieka<span style="font-weight:400">.</span>
  </div>

  <div class="subtitle">
    Content Management System
  </div>

  <div id="loading" class="loading">
    Memeriksa undangan...
  </div>

  <div id="content" style="display:none">

    <h1>Aktifkan Akun</h1>

    <div class="desc">
      Anda telah menerima undangan untuk bergabung
      dengan Kronieka. Buat password untuk mengaktifkan
      akun Anda.
    </div>

    <div class="form">

      <label>
        Nama
        <input id="name" type="text" readonly>
      </label>

      <label>
        Email
        <input id="email" type="email" readonly>
      </label>

      <label>
        Password Baru
        <input
          id="password"
          type="password"
          autocomplete="new-password"
          placeholder="Minimal 8 karakter"
        >
      </label>

      <label>
        Konfirmasi Password
        <input
          id="password2"
          type="password"
          autocomplete="new-password"
          placeholder="Ulangi password"
        >
      </label>

      <button id="activateBtn" onclick="activateAccount()">
        Aktifkan Akun
      </button>

    </div>

    <div id="message" class="message"></div>

  </div>

</div>

<script>

const SUPABASE_URL =
  "https://auohuclvwhrayvuofxyy.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_1oHlkx9lrnIgD8G79RrTig_g8nRY88y";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );

let currentUser = null;


// ==================================================
// INIT
// ==================================================

async function init(){

  try{

    /*
     * Supabase akan membaca token invitation
     * dari URL dan membuat session.
     */

    const {
      data,
      error
    } = await supabaseClient.auth.getSession();

    if(error){
      throw error;
    }

    const session = data.session;

    if(!session || !session.user){

      showError(
        "Link undangan tidak valid atau sudah kedaluwarsa. " +
        "Silakan minta Admin mengirim undangan baru."
      );

      return;
    }

    currentUser = session.user;

    const metadata =
      currentUser.user_metadata || {};

    document.getElementById("name").value =
      metadata.name ||
      metadata.display_name ||
      "";

    document.getElementById("email").value =
      currentUser.email || "";

    document.getElementById("loading").style.display =
      "none";

    document.getElementById("content").style.display =
      "block";

  }catch(error){

    console.error(error);

    showError(
      error.message ||
      "Undangan tidak dapat diproses."
    );

  }

}


// ==================================================
// AKTIFKAN AKUN
// ==================================================

async function activateAccount(){

  const password =
    document.getElementById("password").value;

  const password2 =
    document.getElementById("password2").value;

  const button =
    document.getElementById("activateBtn");

  clearMessage();

  if(!password){

    showError(
      "Password wajib diisi."
    );

    return;
  }

  if(password.length < 8){

    showError(
      "Password minimal 8 karakter."
    );

    return;
  }

  if(password !== password2){

    showError(
      "Konfirmasi password tidak sama."
    );

    return;
  }

  button.disabled = true;
  button.textContent =
    "Mengaktifkan...";

  try{

    // ----------------------------------------------
    // 1. SET PASSWORD SUPABASE AUTH
    // ----------------------------------------------

    const {
      data: updatedUser,
      error: updateError
    } = await supabaseClient.auth.updateUser({
      password: password
    });

    if(updateError){
      throw updateError;
    }

    const user =
      updatedUser.user || currentUser;

    // ----------------------------------------------
    // 2. AMBIL NAMA
    // ----------------------------------------------

    const metadata =
      user.user_metadata || {};

    const name =
      metadata.name ||
      metadata.display_name ||
      document.getElementById("name").value ||
      "";

    const email =
      user.email ||
      document.getElementById("email").value ||
      "";

    // ----------------------------------------------
    // 3. UPDATE PROFILE
    // ----------------------------------------------

    const {
      error: profileError
    } = await supabaseClient
      .from("profiles")
      .update({
        name:name,
        email:email,
        role:"member",
        status:"active"
      })
      .eq("id",user.id);

    /*
     * Jika profile belum ada, coba insert.
     */

    if(profileError){

      console.warn(
        "Profile update gagal:",
        profileError.message
      );

      const {
        error:insertError
      } = await supabaseClient
        .from("profiles")
        .insert({
          id:user.id,
          name:name,
          email:email,
          role:"member",
          status:"active"
        });

      if(insertError){

        console.warn(
          "Profile insert juga gagal:",
          insertError.message
        );

      }

    }

    // ----------------------------------------------
    // 4. BERHASIL
    // ----------------------------------------------

    showSuccess(
      "Akun berhasil diaktifkan. " +
      "Anda akan diarahkan ke halaman login..."
    );

    setTimeout(() => {

      window.location.href =
        "https://kronieka.github.io/content-management/";

    },1800);

  }catch(error){

    console.error(
      "Activation error:",
      error
    );

    showError(
      error.message ||
      "Gagal mengaktifkan akun."
    );

    button.disabled = false;
    button.textContent =
      "Aktifkan Akun";
  }

}


// ==================================================
// MESSAGE
// ==================================================

function showError(message){

  document.getElementById("loading").style.display =
    "none";

  document.getElementById("content").style.display =
    "block";

  const el =
    document.getElementById("message");

  el.className =
    "message error";

  el.textContent =
    message;
}

function showSuccess(message){

  const el =
    document.getElementById("message");

  el.className =
    "message success";

  el.textContent =
    message;
}

function clearMessage(){

  const el =
    document.getElementById("message");

  el.className =
    "message";

  el.textContent =
    "";
}


// ==================================================
// START
// ==================================================

init();

</script>

</body>
</html>
